name: CI
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || (github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: glibc
            container: archlinux:latest
            install: arch
          - distro: musl
            container: alpine:latest
            install: alpine

    steps:
      - name: Install dependencies (glibc)
        if: matrix.install == 'arch'
        run: |
          pacman -Syu --noconfirm base-devel rust cargo git openssl libxcb pkgconf python
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies (musl)
        if: matrix.install == 'alpine'
        run: |
          apk add --no-cache build-base rust cargo rustfmt clippy git openssl-dev libxcb-dev pkgconf python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: make build

      - name: Run tests
        run: cargo test --release

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Ruff Lint check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'check app_window.py'
      - name: Run Ruff Format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: 'format --check app_window.py'
