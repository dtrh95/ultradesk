name: Publish to AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (for example 0.2.0)'
        required: false
      pkgrel:
        description: 'AUR package release number (pkgrel)'
        required: false
        default: '1'
      publish_bin:
        description: 'Also publish ultradesk-rust-bin package'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: publish-aur
  cancel-in-progress: false

jobs:
  publish-aur-source:
    name: AUR [ultradesk-rust]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch packaging tools
        run: |
          pacman -Syu --noconfirm base-devel git openssh pacman-contrib curl

      - uses: actions/checkout@v7

      - name: Publish ultradesk-rust to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME || 'GitHub Actions' }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL || 'actions@github.com' }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PKGREL: ${{ github.event.inputs.pkgrel || '1' }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "AUR_SSH_PRIVATE_KEY secret is not configured; skipping AUR push."
            exit 0
          fi

          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ -n "${RELEASE_TAG}" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          PKGREL="${INPUT_PKGREL}"
          REPO_URL="https://github.com/${REPO_SLUG}"
          TARBALL_URL="${REPO_URL}/archive/v${VERSION}.tar.gz"

          echo "Downloading ${TARBALL_URL} to compute sha256sum..."
          SHA256=$(curl -fsSL "${TARBALL_URL}" | sha256sum | awk '{print $1}')

          useradd -m builder
          mkdir -p /home/builder/.ssh
          printf "%s\n" "${AUR_SSH_PRIVATE_KEY}" > /home/builder/.ssh/id_aur
          chmod 600 /home/builder/.ssh/id_aur
          cat > /home/builder/.ssh/config << 'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/id_aur
            User aur
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 /home/builder/.ssh/config
          chown -R builder:builder /home/builder/.ssh

          su builder -c "git clone ssh://aur@aur.archlinux.org/ultradesk-rust.git /tmp/aur-pkg"
          cp packaging/arch/PKGBUILD /tmp/aur-pkg/PKGBUILD
          sed -i \
            -e "s|^pkgver=.*|pkgver=${VERSION}|" \
            -e "s|^pkgrel=.*|pkgrel=${PKGREL}|" \
            -e "s|^url=.*|url=\"${REPO_URL}\"|" \
            -e "s|^sha256sums=.*|sha256sums=('${SHA256}')|" \
            /tmp/aur-pkg/PKGBUILD
          chown -R builder:builder /tmp/aur-pkg

          su builder -c "cd /tmp/aur-pkg && makepkg --printsrcinfo > .SRCINFO"
          cd /tmp/aur-pkg
          git config user.name "${AUR_USERNAME}"
          git config user.email "${AUR_EMAIL}"
          git add PKGBUILD .SRCINFO
          if git diff --staged --quiet; then
            echo "AUR package ultradesk-rust is already up to date at ${VERSION}-${PKGREL}."
          else
            git commit -m "chore(aur): update ultradesk-rust to ${VERSION}-${PKGREL}"
            su builder -c "cd /tmp/aur-pkg && git push origin master"
          fi

  publish-aur-bin:
    name: AUR [ultradesk-rust-bin]
    if: ${{ github.event_name == 'release' || github.event.inputs.publish_bin == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch packaging tools
        run: |
          pacman -Syu --noconfirm base-devel git openssh pacman-contrib curl

      - uses: actions/checkout@v7

      - name: Publish ultradesk-rust-bin to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME || 'GitHub Actions' }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL || 'actions@github.com' }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PKGREL: ${{ github.event.inputs.pkgrel || '1' }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "AUR_SSH_PRIVATE_KEY secret is not configured; skipping AUR binary push."
            exit 0
          fi

          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ -n "${RELEASE_TAG}" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          PKGREL="${INPUT_PKGREL}"
          REPO_URL="https://github.com/${REPO_SLUG}"
          BIN_URL="${REPO_URL}/releases/download/v${VERSION}/ultradesk-rust-v${VERSION}-x86_64-archlinux.tar.zst"

          echo "Downloading ${BIN_URL} to compute sha256sum..."
          SHA256=$(curl -fsSL "${BIN_URL}" | sha256sum | awk '{print $1}')

          useradd -m builder
          mkdir -p /home/builder/.ssh
          printf "%s\n" "${AUR_SSH_PRIVATE_KEY}" > /home/builder/.ssh/id_aur
          chmod 600 /home/builder/.ssh/id_aur
          cat > /home/builder/.ssh/config << 'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/id_aur
            User aur
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 /home/builder/.ssh/config
          chown -R builder:builder /home/builder/.ssh

          su builder -c "git clone ssh://aur@aur.archlinux.org/ultradesk-rust-bin.git /tmp/aur-bin"
          cp packaging/arch/PKGBUILD-bin /tmp/aur-bin/PKGBUILD
          sed -i \
            -e "s|^pkgver=.*|pkgver=${VERSION}|" \
            -e "s|^pkgrel=.*|pkgrel=${PKGREL}|" \
            -e "s|^url=.*|url=\"${REPO_URL}\"|" \
            -e "s|^sha256sums=.*|sha256sums=('${SHA256}')|" \
            /tmp/aur-bin/PKGBUILD
          chown -R builder:builder /tmp/aur-bin

          su builder -c "cd /tmp/aur-bin && makepkg --printsrcinfo > .SRCINFO"
          cd /tmp/aur-bin
          git config user.name "${AUR_USERNAME}"
          git config user.email "${AUR_EMAIL}"
          git add PKGBUILD .SRCINFO
          if git diff --staged --quiet; then
            echo "AUR package ultradesk-rust-bin is already up to date at ${VERSION}-${PKGREL}."
          else
            git commit -m "chore(aur): update ultradesk-rust-bin to ${VERSION}-${PKGREL}"
            su builder -c "cd /tmp/aur-bin && git push origin master"
          fi
