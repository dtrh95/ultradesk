<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UltraDesk (Rust)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root {
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --t-label: 13px;
  --t-small: 14px;
  --t-body: 16px;
  --t-card: 20px;
  --t-h2: 24px;
  --display-weight: 500;
  --display-tracking: -0.025em;
  --text-xs: 11px;
  --text-sm: 12px;
  --text-md: 13px;
  --text-lg: 16px;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 8px;
  --r-btn: 4px;
  --m-in: 140ms;
  --m-out: 200ms;
  --m-press: 90ms;
  --m-panel: 200ms;
  --m-slide: 240ms;
  --m-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --m-ease-io: cubic-bezier(0.65, 0, 0.35, 1);
  --sans:
    'Host Grotesk', 'Noto Sans', 'Cantarell', system-ui, -apple-system, BlinkMacSystemFont,
    'Segoe UI', sans-serif;
  --mono:
    'JetBrains Mono', 'Noto Sans Mono', 'DejaVu Sans Mono', ui-monospace, SFMono-Regular, Menlo,
    Monaco, Consolas, monospace;
}
:root,
:root[data-theme="gruvbox-dark"] {
  --bg: #1d2021;
  --stage-bg: #141617;
  --surface: #282828;
  --surface-variant: #32302f;
  --surface-high: #3c3836;
  --backdrop-bg: rgba(20, 22, 23, 0.72);
  --card-shadow: none;
  --line: rgba(235, 219, 178, 0.12);
  --line-strong: #504945;
  --border: var(--line);
  --border-strong: var(--line-strong);
  --ink: #fbf1c7;
  --muted: #d5c4a1;
  --ink-dim: #928374;
  --text: var(--ink);
  --text-muted: var(--muted);
  --text-dim: var(--ink-dim);
  --action: #b8bb26;
  --primary: var(--action);
  --primary-soft: rgba(184, 187, 38, 0.16);
  --on-primary: #1d2021;
  --secondary: #fabd2f;
  --secondary-soft: rgba(250, 189, 47, 0.12);
  --tertiary: #83a598;
  --danger: #fb4934;
  --status-ok: #b8bb26;
}
:root[data-theme="onedark"] {
  --bg: #21252b;
  --stage-bg: #181a1f;
  --surface: #282c34;
  --surface-variant: #2c313c;
  --surface-high: #353b45;
  --backdrop-bg: rgba(24, 26, 31, 0.74);
  --card-shadow: none;
  --line: rgba(171, 178, 191, 0.14);
  --line-strong: #3e4451;
  --border: var(--line);
  --border-strong: var(--line-strong);
  --ink: #abb2bf;
  --muted: #9da5b4;
  --ink-dim: #5c6370;
  --text: var(--ink);
  --text-muted: var(--muted);
  --text-dim: var(--ink-dim);
  --action: #61afef;
  --primary: var(--action);
  --primary-soft: rgba(97, 175, 239, 0.16);
  --on-primary: #181a1f;
  --secondary: #e5c07b;
  --secondary-soft: rgba(229, 192, 123, 0.12);
  --tertiary: #56b6c2;
  --danger: #e06c75;
  --status-ok: #98c379;
}
:root[data-theme="onelight"] {
  --bg: #fafafa;
  --stage-bg: #f2f2f4;
  --surface: #ffffff;
  --surface-variant: #f0f0f1;
  --surface-high: #e5e5e6;
  --backdrop-bg: rgba(24, 26, 31, 0.18);
  --card-shadow: none;
  --line: rgba(56, 58, 66, 0.12);
  --line-strong: #d3d4d5;
  --border: var(--line);
  --border-strong: var(--line-strong);
  --ink: #383a42;
  --muted: #4f525e;
  --ink-dim: #a0a1a7;
  --text: var(--ink);
  --text-muted: var(--muted);
  --text-dim: var(--ink-dim);
  --action: #4078f2;
  --primary: var(--action);
  --primary-soft: rgba(64, 120, 242, 0.14);
  --on-primary: #ffffff;
  --secondary: #c18401;
  --secondary-soft: rgba(193, 132, 1, 0.12);
  --tertiary: #0184bc;
  --danger: #e45649;
  --status-ok: #50a14f;
}
:root[data-theme="vscode-dark"] {
  --bg: #181818;
  --stage-bg: #111111;
  --surface: #1f1f1f;
  --surface-variant: #252526;
  --surface-high: #313132;
  --backdrop-bg: rgba(12, 12, 12, 0.74);
  --card-shadow: none;
  --line: rgba(204, 204, 204, 0.12);
  --line-strong: #3c3c3c;
  --border: var(--line);
  --border-strong: var(--line-strong);
  --ink: #cccccc;
  --muted: #9d9d9d;
  --ink-dim: #6e7681;
  --text: var(--ink);
  --text-muted: var(--muted);
  --text-dim: var(--ink-dim);
  --action: #0078d4;
  --primary: var(--action);
  --primary-soft: rgba(0, 120, 212, 0.2);
  --on-primary: #ffffff;
  --secondary: #dcdcaa;
  --secondary-soft: rgba(220, 220, 170, 0.12);
  --tertiary: #4ec9b0;
  --danger: #f14c4c;
  --status-ok: #4ec9b0;
}
:root[data-theme="vscode-light"] {
  --bg: #f8f8f8;
  --stage-bg: #f1f1f3;
  --surface: #ffffff;
  --surface-variant: #f3f3f3;
  --surface-high: #e4e6f1;
  --backdrop-bg: rgba(24, 24, 27, 0.16);
  --card-shadow: none;
  --line: rgba(31, 31, 31, 0.11);
  --line-strong: #cecece;
  --border: var(--line);
  --border-strong: var(--line-strong);
  --ink: #1f1f1f;
  --muted: #3b3b3b;
  --ink-dim: #717171;
  --text: var(--ink);
  --text-muted: var(--muted);
  --text-dim: var(--ink-dim);
  --action: #005fb8;
  --primary: var(--action);
  --primary-soft: rgba(0, 95, 184, 0.14);
  --on-primary: #ffffff;
  --secondary: #795e26;
  --secondary-soft: rgba(121, 94, 38, 0.12);
  --tertiary: #008080;
  --danger: #cd3131;
  --status-ok: #16825d;
}
:root[data-theme="gruvbox-light"] {
  --bg: #f9f5d7;
  --stage-bg: #f2e5bc;
  --surface: #fbf1c7;
  --surface-variant: #f2e5bc;
  --surface-high: #ebdbb2;
  --backdrop-bg: rgba(60, 56, 54, 0.2);
  --card-shadow: none;
  --line: rgba(60, 56, 54, 0.14);
  --line-strong: #d5c4a1;
  --border: var(--line);
  --border-strong: var(--line-strong);
  --ink: #3c3836;
  --muted: #504945;
  --ink-dim: #7c6f64;
  --text: var(--ink);
  --text-muted: var(--muted);
  --text-dim: var(--ink-dim);
  --action: #79740e;
  --primary: var(--action);
  --primary-soft: rgba(121, 116, 14, 0.15);
  --on-primary: #fbf1c7;
  --secondary: #b57614;
  --secondary-soft: rgba(181, 118, 20, 0.14);
  --tertiary: #076678;
  --danger: #9d0006;
  --status-ok: #79740e;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html,
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: var(--t-label);
  width: 100vw;
  height: 100vh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  user-select: none;
}
ud-root,
ud-top-pill-toolbar,
ud-ui-notice,
ud-canvas-stage,
ud-connect-modal,
ud-tools-popover,
ud-update-modal {
  display: contents;
}
.svg-icon {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex-shrink: 0;
}
.canvas-stage {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  height: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--stage-bg);
  overflow: hidden;
  position: relative;
}
canvas#screen {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: 100%;
  height: 100%;
  object-fit: contain;
  outline: none;
  background: var(--stage-bg);
}
.top-pill,
.top-pill.menu-toolbar {
  width: 100%;
  height: 44px;
  min-height: 44px;
  max-height: 44px;
  box-sizing: border-box;
  border-radius: 0;
  border: none;
  border-bottom: 1px solid var(--line-strong);
  padding: 0 var(--s-3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  top: 0;
  left: 0;
  transform: none;
  background: var(--surface);
  box-shadow: none;
  z-index: 30;
  transition:
    height var(--m-panel) var(--m-ease),
    min-height var(--m-panel) var(--m-ease),
    padding var(--m-panel) var(--m-ease);
}
.top-pill.collapsed,
.top-pill.menu-toolbar.collapsed {
  height: 0;
  min-height: 0;
  max-height: 0;
  padding: 0;
  border-bottom: none;
  overflow: visible;
}
.pill-expanded-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: var(--s-2);
}
.toolbar-cluster {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pill-brand {
  font-family: var(--sans);
  font-size: var(--t-small);
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--ink);
  padding: 0 4px;
}
.top-pill.collapsed .pill-expanded-content,
.top-pill.menu-toolbar.collapsed .pill-expanded-content {
  display: none;
}
.pill-drag-handle {
  background: transparent;
  color: var(--muted);
  border: none;
  padding: 5px 6px;
  border-radius: var(--r-btn);
  cursor: default;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
}
.top-pill.collapsed .pill-drag-handle,
.top-pill.menu-toolbar.collapsed .pill-drag-handle {
  display: none !important;
}
.top-pill.collapsed #btnRestorePill,
.top-pill.menu-toolbar.collapsed #btnRestorePill {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 0 0 var(--r-md) var(--r-md);
  z-index: 40;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 12px;
  border: 1px solid var(--line-strong);
  border-top: none;
  background: var(--surface-variant);
  box-shadow: none;
  cursor: pointer;
}
.top-pill:not(.collapsed) #btnRestorePill,
.top-pill.menu-toolbar:not(.collapsed) #btnRestorePill {
  display: none;
}
.pill-drag-handle:hover {
  color: var(--ink);
  background: var(--surface-variant);
}
.pill-btn {
  height: 32px;
  background: transparent;
  color: var(--muted);
  border: 1px solid transparent;
  padding: 0 var(--s-2);
  border-radius: var(--r-btn);
  font-size: var(--t-label);
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
  cursor: pointer;
  box-sizing: border-box;
  transition:
    background-color var(--m-out) var(--m-ease),
    color var(--m-out) var(--m-ease),
    border-color var(--m-out) var(--m-ease),
    transform var(--m-press) var(--m-ease);
}
.pill-btn:hover {
  background: var(--surface-variant);
  color: var(--ink);
}
.pill-btn.active {
  background: var(--action);
  color: var(--on-primary);
}
#btnToggleConnect[data-conn-state='connected']:not(.active) {
  background: var(--surface-variant);
  border-color: var(--line);
  color: var(--status-ok);
}
#btnToggleConnect[data-conn-state='connecting']:not(.active) {
  background: var(--surface-variant);
  border-color: var(--line);
  color: var(--secondary);
}
#btnToggleConnect[data-conn-state='connected']:not(.active):hover,
#btnToggleConnect[data-conn-state='connecting']:not(.active):hover {
  border-color: var(--line-strong);
}
.pill-sep {
  width: 1px;
  height: 18px;
  background: var(--line-strong);
  margin: 0 2px;
}
.status-badge {
  font-family: var(--sans);
  font-size: var(--text-xs);
  font-weight: 500;
  padding: 4px 10px;
  border-radius: var(--r-btn);
  background: var(--surface-variant);
  color: var(--muted);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.status-badge.e2e-badge {
  background: var(--primary-soft);
  color: var(--status-ok);
  border-color: var(--status-ok);
  font-family: var(--mono);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.pill-select {
  height: 32px;
  background: var(--surface-variant);
  color: var(--muted);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-btn);
  padding: 0 var(--s-2);
  font-size: var(--t-label);
  font-weight: 500;
  font-family: var(--sans);
  outline: none;
  cursor: pointer;
  box-sizing: border-box;
}
.pill-select:focus {
  border-color: var(--action);
}
.monitor-quick-bar {
  display: none;
  align-items: center;
  gap: 2px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-btn);
  padding: 2px;
}
.mon-chip {
  background: transparent;
  color: var(--muted);
  border: none;
  padding: 3px 8px;
  border-radius: var(--r-btn);
  font-family: var(--sans);
  font-size: var(--text-xs);
  font-weight: 500;
  cursor: pointer;
}
.mon-chip:hover {
  color: var(--ink);
  background: var(--surface-variant);
}
.mon-chip.active {
  background: var(--action);
  color: var(--on-primary);
}
.mon-grid {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-1);
}
.mon-card {
  background: var(--surface);
  border: 1px solid var(--line-strong);
  color: var(--muted);
  padding: 5px 9px;
  border-radius: var(--r-btn);
  font-family: var(--sans);
  font-size: var(--text-xs);
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
}
.mon-card:hover {
  border-color: var(--action);
  color: var(--ink);
}
.mon-card.active {
  background: var(--primary-soft);
  border-color: var(--action);
  color: var(--action);
}
.mon-card input[type='checkbox'] {
  width: 13px;
  height: 13px;
  accent-color: var(--action);
  cursor: pointer;
  margin: 0;
}
.lang-switch {
  display: inline-flex;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-btn);
  padding: 2px;
  gap: 2px;
}
.lang-btn {
  background: transparent;
  color: var(--muted);
  border: none;
  padding: 3px 8px;
  border-radius: var(--r-btn);
  font-family: var(--sans);
  font-size: var(--text-xs);
  font-weight: 600;
  cursor: pointer;
}
.lang-btn.active {
  background: var(--surface-high);
  color: var(--action);
}
.pill-restore-tab {
  display: none;
  background: transparent;
  color: var(--muted);
  border: 1px solid transparent;
  padding: 4px 8px;
  border-radius: var(--r-btn);
  align-items: center;
  gap: 6px;
  cursor: pointer;
  touch-action: none;
}
.pill-restore-tab:hover {
  background: var(--surface-variant);
  color: var(--ink);
}
.top-pill.collapsed .pill-restore-tab {
  display: inline-flex;
}
.restore-dot {
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--muted);
  color: var(--muted);
  flex-shrink: 0;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 25;
  background: var(--backdrop-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--s-5);
}
.spotlight-card {
  width: 100%;
  max-width: 840px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-lg);
  box-shadow: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
}
@media (max-width: 720px) {
  .spotlight-card {
    grid-template-columns: 1fr;
  }
  .pane.host {
    border-right: none;
    border-bottom: 1px solid var(--line);
  }
}
.pane {
  padding: var(--s-5);
  display: flex;
  flex-direction: column;
  gap: var(--s-4);
}
.pane.host {
  background: var(--bg);
  border-right: 1px solid var(--line);
}
.pane-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
}
.pane-title {
  font-size: 18px;
  line-height: 1.25;
  font-weight: 500;
  letter-spacing: -0.025em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: var(--s-2);
  text-transform: none;
}
.pane.remote .pane-title {
  color: var(--ink);
}
.badge {
  font-family: var(--sans);
  font-size: var(--text-xs);
  font-weight: 500;
  padding: 2px 8px;
  border-radius: var(--r-btn);
  background: var(--surface-variant);
  color: var(--muted);
  border: 1px solid var(--line);
  white-space: nowrap;
  flex-shrink: 0;
}
.cred-box {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  padding: var(--s-3) 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-2);
}
.cred-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.cred-label {
  font-family: var(--sans);
  font-size: var(--t-label);
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  color: var(--muted);
}
.cred-val {
  font-family: var(--mono);
  font-size: var(--text-lg);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  letter-spacing: 0.04em;
  user-select: text;
}
.cred-val.pass {
  color: var(--ink);
}
.field-label {
  font-size: var(--t-label);
  color: var(--muted);
  font-weight: 500;
  margin-bottom: var(--s-1);
  display: block;
  text-transform: none;
}
.row {
  display: flex;
  gap: var(--s-2);
  align-items: center;
}
.col {
  display: flex;
  flex-direction: column;
  flex: 1;
}
input[type='text'],
input[type='password'],
textarea,
select {
  height: 36px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  color: var(--ink);
  padding: 0 var(--s-3);
  border-radius: var(--r-btn);
  font-size: var(--t-label);
  font-weight: 500;
  font-family: var(--sans);
  outline: none;
  width: 100%;
  box-sizing: border-box;
  transition: border-color var(--m-out) var(--m-ease);
}
textarea {
  height: auto;
  padding: var(--s-2) var(--s-3);
}
input.mono,
textarea.mono,
.mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}
input:focus,
textarea:focus,
select:focus {
  border-color: var(--action);
}
button {
  height: 36px;
  background: var(--action);
  color: var(--on-primary);
  border: 1px solid transparent;
  padding: 0 var(--s-3);
  border-radius: var(--r-btn);
  font-size: var(--t-label);
  font-weight: 500;
  font-family: var(--sans);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  white-space: nowrap;
  box-sizing: border-box;
  transition:
    background-color var(--m-out) var(--m-ease),
    color var(--m-out) var(--m-ease),
    border-color var(--m-out) var(--m-ease),
    transform var(--m-press) var(--m-ease);
}
button.secondary {
  background: var(--surface-high);
  color: var(--ink);
  border-color: var(--line-strong);
}
button.danger {
  background: transparent;
  color: var(--muted);
  border-color: var(--line-strong);
}
button.danger:hover {
  background: var(--surface-variant);
  color: var(--danger);
  border-color: var(--danger);
}
.check-label {
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
  font-size: var(--t-label);
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.check-label input {
  width: auto;
  accent-color: var(--action);
  cursor: pointer;
}
.approval-box {
  display: none;
  background: var(--secondary-soft);
  border: 1px solid var(--secondary);
  border-radius: var(--r-md);
  padding: var(--s-3);
  flex-direction: column;
  gap: var(--s-2);
}
.approval-prompt {
  font-size: var(--t-label);
  font-weight: 600;
  color: var(--secondary);
}
.muted {
  font-family: var(--sans);
  font-size: var(--text-xs);
  color: var(--muted);
}
.tools-popover {
  position: fixed;
  top: 52px;
  right: 16px;
  z-index: 28;
  width: 360px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-lg);
  box-shadow: none;
  display: none;
  flex-direction: column;
  overflow: hidden;
}
.tab-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--bg);
  padding: var(--s-1);
  gap: var(--s-1);
  border-bottom: 1px solid var(--line);
  position: relative;
  isolation: isolate;
}
.m-tab-ind {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 0;
  border-radius: var(--r-btn);
  background: var(--surface-high);
  pointer-events: none;
  transition:
    transform var(--m-slide) var(--m-ease-io),
    width var(--m-slide) var(--m-ease-io),
    height var(--m-slide) var(--m-ease-io);
}
.tab-btn {
  background: transparent;
  color: var(--muted);
  border: none;
  padding: 6px 4px;
  border-radius: var(--r-btn);
  font-size: var(--t-label);
  font-weight: 500;
  cursor: pointer;
  position: relative;
  z-index: 1;
  transition: color var(--m-out) var(--m-ease);
}
.tab-btn.active {
  background: transparent;
  color: var(--ink);
  font-weight: 600;
}
.tool-pane {
  display: none;
  padding: var(--s-4);
  flex-direction: column;
  gap: var(--s-3);
}
.tool-pane.active {
  display: flex;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--t-label);
  font-weight: 500;
  color: var(--muted);
  text-transform: none;
  letter-spacing: 0;
}
.transfer-list {
  display: flex;
  flex-direction: column;
  max-height: 170px;
  overflow-y: auto;
  background: transparent;
  border: none;
  border-top: 1px solid var(--line);
  border-radius: 0;
  padding: 0;
}
.transfer-item {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  padding: var(--s-2) 0;
  font-size: var(--t-label);
  display: flex;
  flex-direction: column;
  gap: var(--s-1);
}
.progress {
  height: 4px;
  background: var(--bg);
  border-radius: 2px;
  overflow: hidden;
}
.progress > div {
  height: 100%;
  background: var(--action);
}
.divider {
  height: 1px;
  background: var(--line);
  margin: 2px 0;
}
a.dl-link {
  color: var(--action);
  font-weight: 500;
  text-decoration: none;
  margin-left: 6px;
  background-image: linear-gradient(var(--action), var(--action));
  background-position: 0 100%;
  background-repeat: no-repeat;
  background-size: 100% 1px;
  transition: background-size var(--m-out) var(--m-ease);
}
a.dl-link:hover {
  text-decoration: none;
  background-size: 100% 2px;
}
.ui-notice {
  position: fixed;
  top: 52px;
  right: 16px;
  z-index: 100;
  max-width: 400px;
  min-width: 240px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-left: 3px solid var(--danger);
  border-radius: var(--r-md);
  padding: var(--s-2) var(--s-3);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-2);
  color: var(--ink);
  font-size: var(--t-label);
  font-family: var(--sans);
  pointer-events: auto;
}
.ui-notice.active {
  display: flex;
}
.ui-notice.notice-warn {
  border-left-color: var(--secondary);
}
.ui-notice.notice-info {
  border-left-color: var(--action);
}
.ui-notice.notice-error {
  border-left-color: var(--danger);
}
.ui-notice-content {
  flex: 1;
  word-break: break-word;
}
.ui-notice-close {
  height: auto;
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 16px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.ui-notice-close:hover {
  color: var(--ink);
  background: transparent;
  transform: none;
}
#btnCopyHostId.is-copied {
  background: var(--surface-variant);
  color: var(--action);
  border-color: var(--action);
}
@media (hover: hover) and (pointer: fine) {
  button:hover,
  .pill-btn:hover {
    transform: translateY(-1px);
    transition-duration: var(--m-in);
  }
  button:not(.secondary):not(.danger):hover {
    background: color-mix(in oklab, var(--action) 86%, var(--bg));
  }
  button.secondary:hover {
    background: var(--surface-variant);
    border-color: var(--line-strong);
  }
}
button:active,
.pill-btn:active {
  transform: translateY(1px) scale(0.985);
  transition-duration: var(--m-press);
}
:is(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--action);
  outline-offset: 2px;
  animation: m-focus var(--m-out) var(--m-ease);
}
@keyframes m-focus {
  from {
    outline-offset: 6px;
    outline-color: transparent;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    transform: none !important;
  }
}

.update-modal-card {
  max-width: 520px;
  display: flex;
  flex-direction: column;
  padding: var(--s-5);
  gap: var(--s-4);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-lg);
  box-shadow: none;
}
.update-modal-header {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
}
.update-modal-title {
  margin: 0;
  font-size: 18px;
  line-height: 1.25;
  font-weight: 500;
  letter-spacing: -0.025em;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.update-version-row {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  font-family: var(--mono);
  font-size: var(--text-sm);
  color: var(--muted);
}
.update-version-row .current-ver {
  color: var(--ink-dim);
}
.update-version-row .arrow {
  color: var(--action);
}
.update-version-row .latest-ver {
  color: var(--action);
  font-weight: 600;
}
.update-target-chip {
  align-self: flex-start;
  font-family: var(--mono);
  font-size: var(--text-xs);
  padding: 2px 8px;
  border-radius: var(--r-sm);
  background: var(--surface-variant);
  border: 1px solid var(--line);
  color: var(--muted);
}
.update-notes-box {
  max-height: 180px;
  overflow-y: auto;
  padding: var(--s-3);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  font-size: var(--text-sm);
  line-height: 1.5;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}
.update-asset-info {
  font-family: var(--mono);
  font-size: var(--text-xs);
  color: var(--ink-dim);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.update-progress-wrap {
  width: 100%;
  height: 6px;
  background: var(--surface-variant);
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.update-progress-fill {
  height: 100%;
  background: var(--action);
  transition: width var(--m-in) var(--m-ease);
}
.update-status-msg {
  font-size: var(--text-xs);
  color: var(--muted);
}
.update-error-msg {
  font-size: var(--text-xs);
  color: var(--danger);
  font-weight: 500;
}
.update-actions-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--s-3);
  margin-top: var(--s-2);
}
.update-badge-btn {
  background: var(--primary-soft);
  color: var(--action);
  border-color: var(--action);
}
.update-badge-btn:hover {
  background: var(--action);
  color: var(--on-primary);
}
</style>
</head>
