name: Publish Debian APT

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (for example 0.2.0)'
        required: false

permissions:
  contents: write

concurrency:
  group: publish-debian-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debian-deb:
    name: Debian DEB [${{ matrix.codename }}]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:12
            codename: bookworm
            suite: stable
          - distro: debian:13
            codename: trixie
            suite: testing
          - distro: debian:testing
            codename: forky
            suite: testing
          - distro: debian:unstable
            codename: sid
            suite: unstable

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Prepare debian directory
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MATRIX_CODENAME: ${{ matrix.codename }}
        run: |
          cp -r packaging/debian debian
          if [ -n "${INPUT_VERSION}" ]; then
            VER="${INPUT_VERSION}"
          elif [ -n "${RELEASE_TAG}" ]; then
            VER="${RELEASE_TAG}"
            VER="${VER#v}"
          else
            VER=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          case "${VER}" in
            *[!0-9A-Za-z._+-]*|"")
              echo "Invalid version string: ${VER}" >&2
              exit 1
              ;;
          esac
          sed -i "1s|(0\.2\.0-1)|(${VER}-1~${MATRIX_CODENAME}1)|" debian/changelog

      - name: Build Debian DEB package
        uses: jtdor/build-deb-action@v1
        with:
          docker-image: ${{ matrix.distro }}
          buildpackage-opts: --build=binary --no-sign

      - name: Rename DEB artifact with codename
        run: |
          for f in debian/artifacts/*.deb; do
            base=$(basename "$f" .deb)
            sudo mv "$f" "debian/artifacts/${base}_debian-${{ matrix.codename }}.deb"
          done

      - name: Build APT repository metadata for ${{ matrix.codename }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y reprepro gnupg2

          mkdir -p "repo/apt/debian/${{ matrix.codename }}/conf"
          SIGN_LINE=""
          if [ -n "${GPG_PRIVATE_KEY}" ]; then
            mkdir -p ~/.gnupg
            chmod 700 ~/.gnupg
            echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
            echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
            echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
            FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
            echo "${FINGERPRINT}:6:" | gpg --import-ownertrust
            gpg-connect-agent reloadagent /bye || true
            SIGN_LINE="SignWith: ${FINGERPRINT}"
          fi

          cat > "repo/apt/debian/${{ matrix.codename }}/conf/distributions" << EOF
          Origin: UltraDesk
          Label: UltraDesk Debian Repository
          Codename: ${{ matrix.codename }}
          Suite: ${{ matrix.suite }}
          Components: main
          Architectures: amd64
          Description: UltraDesk Rust packages for Debian ${{ matrix.codename }}
          ${SIGN_LINE}
          EOF

          for deb in debian/artifacts/*.deb; do
            [ -f "$deb" ] || continue
            reprepro --gnupghome ~/.gnupg -b "repo/apt/debian/${{ matrix.codename }}" includedeb "${{ matrix.codename }}" "$deb"
          done

          if [ -n "${GPG_PRIVATE_KEY}" ]; then
            gpg --batch --yes --delete-secret-and-public-key "${FINGERPRINT}" || true
          fi

      - name: Upload Debian DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-deb-${{ matrix.codename }}
          path: debian/artifacts/*.deb
          retention-days: 3

      - name: Upload Debian APT repo artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-apt-repo-${{ matrix.codename }}
          path: repo/
          retention-days: 1

  publish-debian-release:
    name: Publish Debian DEBs & APT Repo
    needs: [build-debian-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Debian DEB artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: debian-deb-*
          path: debs/

      - name: Download Debian APT repo slices
        uses: actions/download-artifact@v8
        with:
          pattern: debian-apt-repo-*
          path: apt-slices/

      - name: Merge Debian APT repository and generate installer script
        run: |
          mkdir -p apt-repo/debian
          for d in apt-slices/debian-apt-repo-*/; do
            if [ -d "$d" ]; then
              cp -a "$d". apt-repo/
            fi
          done
          cp packaging/pubkey.gpg apt-repo/pubkey.gpg
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          BASE_URL="https://${OWNER_LC}.github.io/${REPO_NAME}"

          cat > apt-repo/install-debian.sh << EOF
          #!/bin/sh
          set -eu
          CODENAME=\$(. /etc/os-release && echo "\${VERSION_CODENAME:-bookworm}")
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL "${BASE_URL}/pubkey.gpg" | sudo tee /etc/apt/keyrings/ultradesk-rust.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/ultradesk-rust.asc] ${BASE_URL}/apt/debian/\${CODENAME} \${CODENAME} main" | sudo tee /etc/apt/sources.list.d/ultradesk-rust.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y ultradesk-rust
          EOF
          chmod 755 apt-repo/install-debian.sh

      - name: Attach Debian DEBs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: debs/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload merged Debian APT repository artifact
        uses: actions/upload-artifact@v7
        with:
          name: merged-debian-apt-repo
          path: apt-repo/
          retention-days: 3
