name: Build & Release

on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag-pusher:
    name: Verify Tag Pusher (dtrh95 only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Enforce tag push restriction
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${ACTOR}" != "dtrh95" ] || { [ "${TRIGGERING_ACTOR}" != "dtrh95" ] && [ "${TRIGGERING_ACTOR}" != "github-actions[bot]" ]; }; then
            echo "::error::Unauthorized tag push (${REF_NAME}) by ${ACTOR} (triggering_actor: ${TRIGGERING_ACTOR}). Only dtrh95 may push tags."
            git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${REF_NAME}" >/dev/null 2>&1 && \
              git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ":refs/tags/${REF_NAME}" || true
            exit 1
          fi

  build-deb:
    name: DEB [${{ matrix.codename }}]
    needs: [verify-tag-pusher]
    if: github.actor == 'dtrh95' && (github.triggering_actor == 'dtrh95' || github.triggering_actor == 'github-actions[bot]') && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:12
            codename: bookworm
          - distro: debian:13
            codename: trixie
          - distro: debian:testing
            codename: forky
          - distro: debian:unstable
            codename: sid
          - distro: ubuntu:22.04
            codename: jammy
          - distro: ubuntu:24.04
            codename: noble
          - distro: ubuntu:25.10
            codename: questing
          - distro: ubuntu:26.04
            codename: resolute

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Prepare debian directory
        run: cp -r packaging/debian debian

      - name: Build DEB
        uses: jtdor/build-deb-action@v1
        with:
          docker-image: ${{ matrix.distro }}
          buildpackage-opts: --build=binary --no-sign

      - name: Rename DEB artifacts
        run: |
          for f in debian/artifacts/*.deb; do
            base=$(basename "$f" .deb)
            sudo mv "$f" "debian/artifacts/${base}_${{ matrix.codename }}.deb"
          done

      - name: Create APT Repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y reprepro gnupg2

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback"  > ~/.gnupg/gpg.conf
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

          FINGERPRINT=$(gpg --list-secret-keys --with-colons | grep '^fpr' | head -1 | cut -d: -f10)
          echo "${FINGERPRINT}:6:" | gpg --import-ownertrust
          gpg-connect-agent reloadagent /bye || true

          codename="${{ matrix.codename }}"
          case "${{ matrix.distro }}" in
            debian:unstable) suite="unstable" ;;
            debian:testing)  suite="testing"  ;;
            *)               suite="stable"   ;;
          esac

          mkdir -p "repo/apt/${codename}/conf"
          cat > "repo/apt/${codename}/conf/distributions" << EOF
          Codename: ${codename}
          Suite: ${suite}
          Components: main
          Architectures: amd64
          SignWith: ${FINGERPRINT}
          EOF

          for deb in debian/artifacts/*.deb; do
            [ -f "$deb" ] || continue
            reprepro --gnupghome ~/.gnupg -b "repo/apt/${codename}" includedeb "$codename" "$deb"
          done

          gpg --batch --yes --delete-secret-and-public-key "${FINGERPRINT}" || true

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.codename }}
          path: debian/artifacts/*.deb
          retention-days: 1

      - name: Upload APT Repo artifact
        uses: actions/upload-artifact@v7
        with:
          name: repo-apt-${{ matrix.codename }}
          path: repo/
          retention-days: 1

  build-rpm-fedora:
    name: RPM [fedora-${{ matrix.releasever }}]
    needs: [verify-tag-pusher]
    if: github.actor == 'dtrh95' && (github.triggering_actor == 'dtrh95' || github.triggering_actor == 'github-actions[bot]') && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora:43
            releasever: 43
          - distro: fedora:44
            releasever: 44
          - distro: fedora:45
            releasever: 45
          - distro: fedora:rawhide
            releasever: rawhide

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Fedora RPM
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.distro }}
          options: -v ${{ github.workspace }}:/work
          run: |
            set -euo pipefail
            find / -name '*openh264*' -type f -delete 2>/dev/null || true
            dnf clean all
            for attempt in 1 2 3; do
              dnf install --setopt=retries=10 --setopt=timeout=60 -y rpm-build rpmdevtools dnf-plugins-core && break
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 5
            done
            rpmdev-setuptree
            cp /work/packaging/rpm/fedora/ultradesk-rust.spec ~/rpmbuild/SPECS/
            for attempt in 1 2 3; do
              dnf builddep --setopt=install_weak_deps=False --setopt=retries=10 --setopt=timeout=60 -y ~/rpmbuild/SPECS/ultradesk-rust.spec && break
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 5
            done
            mkdir -p ~/rpmbuild/SOURCES
            cd /work
            VERSION=$(grep '^Version:' packaging/rpm/fedora/ultradesk-rust.spec | awk '{print $2}')
            tar --exclude='.git' \
                --exclude='packaging' \
                --exclude='target' \
                --transform "s|^\.|ultradesk-rust-${VERSION}|" \
                -czf ~/rpmbuild/SOURCES/ultradesk-rust-${VERSION}.tar.gz .
            rpmbuild -bb ~/rpmbuild/SPECS/ultradesk-rust.spec
            mkdir -p /work/output
            for rpm in ~/rpmbuild/RPMS/**/*.rpm; do
              base=$(basename "$rpm" .rpm)
              mv "$rpm" "/work/output/${base}.${{ matrix.releasever }}.rpm"
            done

      - name: Sign RPM packages and Create Repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y createrepo-c gnupg2 rpm

          sudo chmod -R 777 output/
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback"  > ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye || true

          KEYID=$(gpg --list-secret-keys --with-colons | grep '^sec' | head -1 | cut -d: -f5)

          cat > ~/.rpmmacros << EOF
          %_gpg_name ${KEYID}
          %_gpg_sign_cmd_extra_args --pinentry-mode loopback
          EOF

          for rpm in output/*.rpm; do
            rpmsign --addsign "$rpm"
          done

          releasever="${{ matrix.releasever }}"
          dir="repo/rpm/fedora/${releasever}/x86_64"
          mkdir -p "$dir"

          for rpm in output/*.rpm; do
            [ -f "$rpm" ] || continue
            [[ "$rpm" == *debug* ]] && continue
            cp "$rpm" "$dir/"
          done

          if [ "$(ls -A $dir)" ]; then
            createrepo_c "$dir"
            gpg --batch --yes --detach-sign --armor "$dir/repodata/repomd.xml"
          fi

          mkdir -p repo/rpm/fedora
          cat > "repo/rpm/fedora/ultradesk-rust-${releasever}.repo" << EOF
          [ultradesk-rust]
          name=ultradesk-rust - Fedora ${releasever}
          baseurl=https://ultradesk-rust.pages.dev/rpm/fedora/${releasever}/x86_64/
          enabled=1
          gpgcheck=1
          gpgkey=https://ultradesk-rust.pages.dev/pubkey.gpg
          EOF

          gpg --batch --yes --delete-secret-and-public-key "$KEYID" || true

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-fedora-${{ matrix.releasever }}
          path: output/*.rpm
          retention-days: 1

      - name: Upload Fedora Repo artifact
        uses: actions/upload-artifact@v7
        with:
          name: repo-rpm-fedora-${{ matrix.releasever }}
          path: repo/
          retention-days: 1

  build-rpm-opensuse:
    name: RPM [opensuse-${{ matrix.releasever }}]
    needs: [verify-tag-pusher]
    if: github.actor == 'dtrh95' && (github.triggering_actor == 'dtrh95' || github.triggering_actor == 'github-actions[bot]') && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: opensuse/tumbleweed
            releasever: tumbleweed

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build openSUSE RPM
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.distro }}
          options: -v ${{ github.workspace }}:/work
          run: |
            set -euo pipefail
            zypper -n dup
            zypper install -y rpm-build rpmdevtools
            rpmdev-setuptree
            cp /work/packaging/rpm/opensuse/ultradesk-rust.spec ~/rpmbuild/SPECS/
            zypper -n install \
              $(rpmspec -P ~/rpmbuild/SPECS/ultradesk-rust.spec \
                | grep '^BuildRequires:' \
                | awk '{print $2}' \
                | xargs)
            mkdir -p ~/rpmbuild/SOURCES
            cd /work
            VERSION=$(grep '^Version:' packaging/rpm/opensuse/ultradesk-rust.spec | awk '{print $2}')
            tar --exclude='.git' \
                --exclude='packaging' \
                --exclude='target' \
                --transform "s|^\.|ultradesk-rust-${VERSION}|" \
                -czf ~/rpmbuild/SOURCES/ultradesk-rust-${VERSION}.tar.gz .
            rpmbuild -bb ~/rpmbuild/SPECS/ultradesk-rust.spec
            mkdir -p /work/output
            for rpm in ~/rpmbuild/RPMS/**/*.rpm; do
              base=$(basename "$rpm" .rpm)
              mv "$rpm" "/work/output/${base}.${{ matrix.releasever }}.rpm"
            done

      - name: Sign RPM packages and Create Repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y createrepo-c gnupg2 rpm

          sudo chmod -R 777 output/
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback"  > ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye || true

          KEYID=$(gpg --list-secret-keys --with-colons | grep '^sec' | head -1 | cut -d: -f5)

          cat > ~/.rpmmacros << EOF
          %_gpg_name ${KEYID}
          %_gpg_sign_cmd_extra_args --pinentry-mode loopback
          EOF

          for rpm in output/*.rpm; do
            rpmsign --addsign "$rpm"
          done

          releasever="${{ matrix.releasever }}"
          dir="repo/rpm/opensuse/${releasever}/x86_64"
          mkdir -p "$dir"

          for rpm in output/*.rpm; do
            [ -f "$rpm" ] || continue
            [[ "$rpm" == *debug* ]] && continue
            cp "$rpm" "$dir/"
          done

          if [ "$(ls -A $dir)" ]; then
            createrepo_c "$dir"
            gpg --batch --yes --detach-sign --armor "$dir/repodata/repomd.xml"
          fi

          mkdir -p repo/rpm/opensuse
          cat > "repo/rpm/opensuse/ultradesk-rust-${releasever}.repo" << EOF
          [ultradesk-rust]
          name=ultradesk-rust - openSUSE ${releasever}
          baseurl=https://ultradesk-rust.pages.dev/rpm/opensuse/${releasever}/x86_64/
          enabled=1
          gpgcheck=1
          gpgkey=https://ultradesk-rust.pages.dev/pubkey.gpg
          EOF

          gpg --batch --yes --delete-secret-and-public-key "$KEYID" || true

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-opensuse-${{ matrix.releasever }}
          path: output/*.rpm
          retention-days: 1

      - name: Upload openSUSE Repo artifact
        uses: actions/upload-artifact@v7
        with:
          name: repo-rpm-opensuse-${{ matrix.releasever }}
          path: repo/
          retention-days: 1

  build-arch:
    name: Arch Linux (zstd)
    needs: [verify-tag-pusher]
    if: github.actor == 'dtrh95' && (github.triggering_actor == 'dtrh95' || github.triggering_actor == 'github-actions[bot]') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build on Arch Linux
        uses: addnab/docker-run-action@v3
        with:
          image: archlinux:latest
          options: -v ${{ github.workspace }}:/work
          run: |
            set -euo pipefail
            pacman -Syu --noconfirm \
              base-devel rust cargo openssl libxcb python \
              make pkgconf zstd gtk3 webkit2gtk-4.1 libsoup3

            cd /work
            make build
            make check
            make install PREFIX=/usr DESTDIR=/work/arch-dist
            find /work/arch-dist/usr/bin -type f \
              -exec strip --strip-all {} + 2>/dev/null || true

      - name: Package as tar.zst
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME}"
          VERSION="${VERSION//\//-}"
          tar -c -I 'zstd -19 -T0' -f "ultradesk-rust-${VERSION}-x86_64-archlinux.tar.zst" -C arch-dist .

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-tar-zst
          path: ultradesk-rust-*-x86_64-archlinux.tar.zst
          retention-days: 1

  build-macos:
    name: macOS [${{ matrix.arch }}]
    needs: [verify-tag-pusher]
    if: github.actor == 'dtrh95' && (github.triggering_actor == 'dtrh95' || github.triggering_actor == 'github-actions[bot]') && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build Angular Web Viewer
        run: |
          cd web
          npm ci
          npm run build

      - name: Install Rust target ${{ matrix.target }}
        run: rustup target add "${{ matrix.target }}"

      - name: Build macOS release binary (${{ matrix.arch }})
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Run unit and security tests on macOS (arm64)
        if: matrix.arch == 'arm64'
        env:
          ULTRADESK_SKIP_MACOS_PROMPT: '1'
        run: cargo test --release --target aarch64-apple-darwin

      - name: Package macOS .app and .dmg installer (${{ matrix.arch }})
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x packaging/macos/package-macos.sh
          ./packaging/macos/package-macos.sh "${{ matrix.target }}" "${{ matrix.arch }}" "${REF_NAME}"

      - name: Upload macOS artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ultradesk-rust-*-${{ matrix.arch }}-macos.dmg
            ultradesk-rust-*-${{ matrix.arch }}-macos.app.tar.gz
          retention-days: 1

  release:
    name: Create GitHub Release
    if: github.actor == 'dtrh95' && (github.triggering_actor == 'dtrh95' || github.triggering_actor == 'github-actions[bot]') && startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-rpm-fedora, build-rpm-opensuse, build-arch, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'artifacts/**/*'

      - name: Generate SHA256 checksums
        run: |
          (cd artifacts && find . -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} + > SHA256SUMS.txt)

      - name: Replace existing GitHub Release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release delete "${TAG_NAME}" --yes || true

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          name: UltraDesk ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/deb-*/**/*.deb
            artifacts/rpm-*/**/*.rpm
            artifacts/**/*.tar.zst
            artifacts/macos-*/**/*.dmg
            artifacts/macos-*/**/*.app.tar.gz
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.actor == 'dtrh95' && (github.triggering_actor == 'dtrh95' || github.triggering_actor == 'github-actions[bot]') && startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download all repo artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: repo-*
          path: downloaded-repos/

      - name: Merge Repos
        run: |
          mkdir -p repo
          for d in downloaded-repos/repo-*/; do
            if [ -d "$d" ]; then
              cp -a "$d". repo/
            fi
          done

      - name: Copy public key
        run: cp packaging/pubkey.gpg repo/pubkey.gpg

      - name: Generate index pages
        uses: gacts/directory-listing@v1
        with:
          target: repo

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler pages project create ultradesk-rust --production-branch=main || true
          command: pages deploy repo --project-name=ultradesk-rust --branch=main --commit-dirty=true
