name: CI
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || (github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: glibc
            container: archlinux:latest
            install: arch
          - distro: musl
            container: alpine:latest
            install: alpine

    steps:
      - name: Install dependencies (glibc)
        if: matrix.install == 'arch'
        run: |
          pacman -Syu --noconfirm base-devel rust cargo git openssl libxcb pkgconf python gtk3 webkit2gtk-4.1 libsoup3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies (musl)
        if: matrix.install == 'alpine'
        run: |
          apk add --no-cache build-base rust cargo rustfmt rust-clippy git openssl-dev libxcb-dev pkgconf python3 gtk+3.0-dev webkit2gtk-4.1-dev libsoup3-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: make build

      - name: Run tests
        run: cargo test --release

  web-lint:
    name: Web UI lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run TypeScript typecheck
        working-directory: web
        run: npm run typecheck
      - name: Run ESLint check
        working-directory: web
        run: npm run lint
      - name: Run Prettier format check
        working-directory: web
        run: npm run format:check
