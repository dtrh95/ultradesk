version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    groups:
      rustcrypto:
        patterns:
          - 'aes'
          - 'cbc'
          - 'cipher'
          - 'des'
          - 'md-5'
          - 'sha2'
