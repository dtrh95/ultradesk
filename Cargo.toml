[package]
name = "ultradesk-rust"
version = "1.0.8"
edition = "2021"
license = "MIT"
description = "Linux-native UltraDesk remote desktop client and host written in Rust with Screen, Input, Audio, Clipboard Sync, and File Transfer"

[lib]
name = "ultradesk_rust"
path = "src/lib.rs"

[[bin]]
name = "ultradesk-rust"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:tao", "dep:wry", "dep:muda", "dep:gtk"]

[dependencies]
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
cipher = { version = "0.5", features = ["alloc", "block-padding"] }
des = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
md-5 = "0.11"
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
x11rb = { version = "0.14", features = ["xtest", "randr", "shm"] }
zstd = "0.14"

tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }
muda = { version = "0.21", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
